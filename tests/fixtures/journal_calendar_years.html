<!doctype html>
<html>
  <body>
    <!-- Real LiveJournal calendar shape: one link per year, plus month links
         for the current year only. Year links carry class="year". -->
    <a href="https://example.livejournal.com/2011/" class="year">2011</a>
    <a href="https://example.livejournal.com/2012/" class="year">2012</a>
    <a href="https://example.livejournal.com/2013/" class="year">2013</a>
    <a href="https://example.livejournal.com/2013/06/">June 2013</a>
    <a href="https://example.livejournal.com/2013/07/">July 2013</a>
  </body>
</html>
